name: ci
on: [push, pull_request]
jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scorer.py --example
      - run: python -c "import json,glob; [json.load(open(p)) for p in glob.glob('items/*/case.json')]; print('cases ok')"
